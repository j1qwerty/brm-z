<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BRM School Management - complete ERP for Indian schools (Nursery to Class 12)" />
    <title>BRM School Management</title>
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong
      // colours. First launch always lands on light: a school's office PC or a
      // projector should not inherit the machine's dark-mode setting.
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('bmrc-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch (e) {
          /* private mode / storage disabled: stay on light */
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
